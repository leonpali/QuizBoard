<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frage bearbeiten</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/editor.css}">
</head>
<body>
    <main class="home">
        <p class="breadcrumb"><a th:href="@{'/editor/categories/' + ${c}}" th:text="'← ' + ${categoryName}">← Kategorie</a></p>
        <h1 th:text="'Frage ' + ${q + 1} + ' bearbeiten'">Frage 1 bearbeiten</h1>

        <div class="errors" th:if="${error}">
            <p th:text="${error}">Fehler</p>
        </div>

        <section class="card">
            <form th:action="@{'/editor/categories/' + ${c} + '/questions/' + ${q} + '/question'}" method="post">
                <label class="field">
                    <span class="field-title">Typ</span>
                    <select class="text-input" name="type">
                        <option value="TEXT" th:selected="${form.isType('TEXT')}">Text</option>
                        <option value="IMAGE" th:selected="${form.isType('IMAGE')}">Bild</option>
                        <option value="LINEUP" th:selected="${form.isType('LINEUP')}">Lineup – deckt die Einträge nacheinander auf</option>
                    </select>
                </label>

                <label class="field">
                    <span class="field-title">Text</span>
                    <span class="field-hint">Für Text- und Lineup-Fragen. Bei Lineup die Einträge mit Komma trennen.</span>
                    <textarea class="text-input" name="text" rows="4" maxlength="1000" th:text="${form.text}"></textarea>
                </label>

                <label class="field">
                    <span class="field-title">Bildname</span>
                    <span class="field-hint">Für Bildfragen, z. B. <code>koeln.jpg</code>.</span>
                    <span class="field-hint">Erlaubte Formate: jpg, jpeg, png, gif, webp, avif, bmp</span>
                    <input class="text-input" type="text" name="img" th:value="${form.img}" maxlength="100">
                </label>

                <label class="field">
                    <span class="field-title">Punkte</span>
                    <span class="field-hint">Eine falsche Antwort zieht die Hälfte ab.</span>
                    <input class="text-input points-input" type="number" name="points" th:value="${form.points}" min="0" max="100000" step="1" required>
                </label>

                <div class="form-actions">
                    <button type="submit" class="primary-button">Speichern</button>
                    <a class="link-button" th:href="@{'/editor/categories/' + ${c}}">Abbrechen</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
