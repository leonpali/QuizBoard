<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Punkte vergeben</title>
    <link rel="stylesheet" th:href="@{/css/score.css}">
</head>
<body>
    <main class="score-page">
        <h1>Punkte vergeben <span class="worth" th:text="${question.points} + ' Punkte'">300 Punkte</span></h1>

        <table class="score-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th th:if="${question.hasInputValues()}">Eingabe</th>
                    <th>Stand</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${rows}">
                    <td class="position" th:text="${row.position} ? ${row.position} + '.' : ''">1.</td>
                    <td class="name" th:text="${row.name}">Name</td>
                    <td class="value" th:if="${question.hasInputValues()}" th:text="${row.value}">Antwort</td>
                    <td class="total" th:text="${row.score}">0</td>
                    <td class="actions">
                        <form th:action="@{${ref.toPath('/score')}}" method="post">
                            <input type="hidden" name="playerId" th:value="${row.playerId}">
                            <button class="result-button correct" name="outcome" value="CORRECT"
                                    th:classappend="${row.isCorrect()} ? 'active' : ''"
                                    th:text="'✔ +' + ${question.points}">✔ +300</button>
                            <button class="result-button wrong" name="outcome" value="WRONG"
                                    th:classappend="${row.isWrong()} ? 'active' : ''"
                                    th:text="'✘ −' + ${question.getPenalty()}">✘ −150</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <form th:action="@{${ref.getBoardPath()}}" method="get">
            <button class="continue-button">Weiter</button>
        </form>
    </main>
</body>
</html>
