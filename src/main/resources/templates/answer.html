<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antwort</title>
    <link rel="stylesheet" th:href="@{/css/answer.css}">
</head>
<body>
    <div class="center-wrapper">
        <div class="answer-block">
            <div th:replace="~{answers/__${question.getAnswerTypeKey()}__ :: content}"></div>
            <form th:action="@{${nextUrl}}" method="get">
                <button class="continue-button">Weiter</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/submissions :: panel}"></div>
</body>
</html>
