<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
</head>
<body>
    <a class="home-link" th:href="@{/host}">Lobby</a>
    <a class="next-link" th:href="@{${nextUrl}}" th:text="${nextLabel} + ' →'">Nächstes Board →</a>
    <div class="board-div">
        <table class="board">
            <thead>
                <tr>
                 <th th:each="cat : ${categories}" th:text="${cat.getName()}" class="category"> Category</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${rows}">
                    <td class="table-cell" th:each="cell : ${row}">
                        <form th:action="@{${cell.openPath}}" method="post">
                            <button class="question-button"
                                    type="submit"
                                    th:text="${cell.points}"
                                    th:disabled="${cell.asked}"
                                    th:classappend="${cell.asked} ? ' disabled' : ''">100
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
