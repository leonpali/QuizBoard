<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <link rel="stylesheet" th:href="@{/css/board.css}" />
</head>
<body>
    <div class="board-div">
        <table class="board">
            <thead>
                <tr>
                 <th th:each="cat : ${categories}" th:text="${cat.getName()}" class="category"> Category</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="i : ${#numbers.sequence(0,5)}">
                    <td class="table-cell" th:each="cat : ${categories}">
                        <form th:action="@{${id} + '/' + ${cat.questions[i].id}}" method="post">
                            <button class="question-button"
                                    type="submit"
                                    th:text="${cat.questions[i].points}"
                                    th:disabled="${cat.questions[i].asked}"
                                    th:classappend="${cat.questions[i].asked} ? ' disabled' : ''">100
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
