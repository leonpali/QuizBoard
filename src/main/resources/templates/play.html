<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Quiz</title>
    <link rel="stylesheet" th:href="@{/css/play.css}" />
    <script th:attr="nonce=${cspNonce}">
        const inputSetups = new Map();
        // setup(section, submit) returns render(state), which updates the section and returns a status text or null
        function registerInput(key, setup) {
            inputSetups.set(key, setup);
        }
    </script>
</head>
<body>
    <main class="play">
        <header class="play-header">
            <span th:text="${name}">Name</span>
            <span id="score" class="score"></span>
            <span>Quiz <span th:text="${code}">123456</span></span>
        </header>

        <section th:each="input : ${inputs}" class="input" th:attr="data-input=${input.key}" hidden>
            <div th:replace="~{inputs/__${input.key}__ :: content}"></div>
        </section>
        <p id="status" class="status">Verbinde…</p>
    </main>

    <script th:attr="nonce=${cspNonce}">
        const status = document.getElementById('status');
        const score = document.getElementById('score');
        const sections = [...document.querySelectorAll('[data-input]')];
        const renderers = new Map(sections.map(section => [section.dataset.input, inputSetups.get(section.dataset.input)(section, submit)]));

        function render(state) {
            score.textContent = state.score + ' Punkte';
            sections.forEach(section => section.hidden = section.dataset.input !== state.input);
            status.textContent = renderers.get(state.input)(state) ?? 'Warte auf die nächste Frage';
        }

        async function submit(value) {
            const body = value === undefined ? undefined : new URLSearchParams({ value });
            const response = await fetch('/play/submit', { method: 'POST', body });
            if (!response.ok) {
                ended('Das Quiz ist nicht mehr verfügbar.');
                return;
            }
            const state = await response.json();
            if (state.submitted && navigator.vibrate) navigator.vibrate(150);
            render(state);
        }

        function ended(message) {
            sections.forEach(section => section.querySelectorAll('button, input').forEach(element => element.disabled = true));
            status.innerHTML = '';
            status.append(message + ' ');
            const link = document.createElement('a');
            link.href = '/join';
            link.textContent = 'Neu beitreten';
            status.append(link);
        }

        const events = new EventSource('/play/events');
        events.addEventListener('state', e => render(JSON.parse(e.data)));
        events.addEventListener('ended', () => {
            events.close();
            ended('Das Quiz wurde beendet.');
        });
        events.onerror = () => {
            if (events.readyState === EventSource.CLOSED) ended('Das Quiz ist nicht mehr verfügbar.');
            else status.textContent = 'Verbindung unterbrochen, verbinde neu…';
        };
    </script>
</body>
</html>
