<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Frage bearbeiten</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/editor.css}">
</head>
<body>
    <main class="home">
        <p class="breadcrumb"><a th:href="@{'/editor/categories/' + ${c}}" th:text="'← ' + ${categoryName}">← Kategorie</a></p>
        <h1 th:text="${title}">Frage 1 bearbeiten</h1>

        <div class="errors" th:if="${error}">
            <p th:text="${error}">Fehler</p>
        </div>

        <section class="card">
            <form th:action="@{${action}}" method="post">
                <label class="field">
                    <span class="field-title">Typ</span>
                    <select class="text-input" name="type">
                        <option th:each="type : ${types}" th:value="${type.key}" th:selected="${form.isType(type.key)}"
                                th:text="${type.label}">Text</option>
                    </select>
                    <span class="field-hint" th:each="hint : ${typeHints}" th:text="${hint}">Hinweis</span>
                </label>

                <label class="field" th:each="field : ${fields}">
                    <span class="field-title" th:text="${field.getLabel()}">Text</span>
                    <span class="field-hint" th:text="'Für: ' + ${field.usedBy}">Für: Text</span>
                    <span class="field-hint" th:if="${field.isFile()}" th:text="'Dateiname. Erlaubte Formate: ' + ${field.getExtensions()}">Formate</span>
                    <textarea th:if="${field.isMultiline()}" class="text-input" th:name="${field.getKey()}" rows="4" maxlength="1000"
                              th:text="${form.getValue(field.getKey())}"></textarea>
                    <input th:unless="${field.isMultiline()}" class="text-input" type="text" th:name="${field.getKey()}" maxlength="100"
                           th:value="${form.getValue(field.getKey())}">
                </label>

                <label class="field" th:if="${hasPoints}">
                    <span class="field-title">Punkte</span>
                    <span class="field-hint">Eine falsche Antwort zieht die Hälfte ab.</span>
                    <input class="text-input points-input" type="number" name="points" th:value="${form.points}" min="0" max="100000" step="1" required>
                </label>

                <div class="form-actions">
                    <button type="submit" class="primary-button">Speichern</button>
                    <a class="link-button" th:href="@{'/editor/categories/' + ${c}}">Abbrechen</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
