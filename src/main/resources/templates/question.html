<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Frage</title>
    <link rel="stylesheet" th:href="@{/css/question.css}">
</head>
<body>
    <div class="center-wrapper">
        <div class="question-block">
            <div th:replace="~{questions/__${question.getTypeKey()}__ :: content}"></div>
            <form th:action="@{${ref.toPath('/answer')}}" method="get">
                <button class="continue-button">Weiter</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/submissions :: panel}"></div>
</body>
</html>
