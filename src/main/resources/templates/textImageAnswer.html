<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Answer</title>
    <link rel="stylesheet" th:href="@{/css/answer.css}">
</head>
<body>
    <div class="center-wrapper">
        <div class="answer-block">
            <img class="answer-image" th:src="@{'/images/' + ${question.getAnswerImage()}}" alt="">
            <p class="answer" th:text="${question.getAnswerText()}"></p>
            <form th:action="@{${nextUrl}}" method="get">
                <button class="continue-button">Weiter</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/buzzers :: panel}"></div>
</body>
</html>
